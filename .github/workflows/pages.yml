name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deploy from main only, and never from the template repo itself.
env:
  DEPLOY: ${{ github.event_name != 'pull_request' && !github.event.repository.is_template }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The template repo keeps its [[PLACEHOLDERS]]; app sites must not.
      - name: Check pages
        run: python3 scripts/check-site.py ${{ github.event.repository.is_template && '--allow-placeholders' || '' }}

      # Publish only the site, not the repo's docs, scripts or README.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.*' --exclude '_site' \
            --exclude 'docs' --exclude 'scripts' --exclude 'README.md' \
            ./ _site/

      - uses: actions/configure-pages@v6
        if: env.DEPLOY == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: env.DEPLOY == 'true'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.is_template
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
