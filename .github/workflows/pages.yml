name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      # Until scripts/new-app.py has filled in [[APP_NAME]], this is the
      # template itself: it may keep its placeholders and never deploys.
      - name: Decide what to do
        id: mode
        run: |
          if grep -q '\[\[APP_NAME\]\]' index.html; then
            echo "check_args=--allow-placeholders" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check pages
        run: python3 scripts/check-site.py ${{ steps.mode.outputs.check_args }}

      # Publish only the site, not the repo's docs, scripts or README.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.*' --exclude '_site' \
            --exclude 'docs' --exclude 'scripts' --exclude 'README.md' \
            ./ _site/

      - uses: actions/configure-pages@v6
        if: steps.mode.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.mode.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
